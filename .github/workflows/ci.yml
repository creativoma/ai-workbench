name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Lint, types and tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: bun install --frozen-lockfile
            - run: bun run lint
            - run: bun run type-check
            - run: bun run test
            - run: bun run build

    e2e:
        name: End-to-end
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: bun install --frozen-lockfile
            # The specs stub /api/*, so no API key and no model spend here.
            - run: bunx playwright install --with-deps chromium
            - run: bun run e2e
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7

    eval:
        name: Evals
        # These call the real model, so they cost money: main and manual runs
        # only, never on every pull request.
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: bun install --frozen-lockfile
            - name: Run evals
              env:
                  AI_PROVIDER: ${{ vars.AI_PROVIDER }}
                  AI_MODEL: ${{ vars.AI_MODEL }}
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                  GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
              run: |
                  if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$GOOGLE_GENERATIVE_AI_API_KEY" ]; then
                    echo "::warning::No provider API key is configured — skipping evals"
                    exit 0
                  fi
                  bun run eval
